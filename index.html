<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<!-- Content Security Policy: scripts, styles and Markdown only from this site.
	     Adjust img-src / frame-src / form-action if your pages embed external content. -->
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self'; font-src 'self'; frame-src https:; object-src 'none'; base-uri 'self'; form-action 'self'">
	<meta name="referrer" content="strict-origin-when-cross-origin">
	<meta name="description" content="markdown-pages.js - simple Markdown-based static sites, without the generator">
	<title>markdown-pages.js</title>
	<link rel="shortcut icon" type="image/png" href="assets/images/favicon.png"/>
	<link rel="stylesheet" href="assets/user-styles.css" />
	<!-- optional documentation theme (top bar, sidebar, table of contents, search) -->
	<link rel="stylesheet" href="assets/docs.css" />
	<!-- optional Markdown editor, used on the Editor page -->
	<link rel="stylesheet" href="assets/vendor/markdown-editor/markdown-editor.css" />
	<!---- adding markdown-page.js file ---->
	<script src="markdown-pages.js"></script>
	<script src="assets/vendor/markdown-editor/markdown-editor.js"></script>
</head>

<body>
	<header class="docs-header"></header>
	<div class="docs-layout">
		<aside class="docs-sidebar" id="docs-sidebar">
			<nav data-mdp-menu="tree" aria-label="Documentation"></nav>
		</aside>
		<div class="docs-content">
			<main></main>
			<nav class="docs-pager" aria-label="Previous and next page"></nav>
		</div>
		<aside class="docs-toc-column">
			<p class="docs-toc-title" aria-hidden="true">On this page</p>
			<nav data-mdp-toc aria-label="On this page"></nav>
		</aside>
	</div>
	<footer></footer>
	<script src="assets/user-scripts.js"></script>
	<script src="assets/docs.js"></script>
</body>
</html>
